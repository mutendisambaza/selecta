[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selecta"
version = "0.1.0"
description = "A Music Information Retrieval (MIR) assistant for DJs — phrase cues + journey-shaped set sequencing."
requires-python = ">=3.12"
readme = "README.md"

[project.scripts]
selecta = "selecta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
